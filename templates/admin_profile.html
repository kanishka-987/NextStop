<!-- templates/admin_profile.html -->
<!-- NextStop - Admin Profile View -->
{% extends 'base.html' %}

{% block title %}Admin Profile - NextStop Transit{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in py-4">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 80px; height: 80px;">
                    <i class="bi bi-person-badge fs-1"></i>
                </div>
                <h3 class="text-white font-weight-bold mb-1">{{ user_name }}</h3>
                <span class="badge bg-primary bg-opacity-20 text-primary border border-primary border-opacity-25 px-3 py-1 text-capitalize">
                    Role: {{ user_role }}
                </span>
            </div>

            <div class="p-3 rounded bg-dark bg-opacity-40 border border-white border-opacity-5 mb-4">
                <div class="mb-3">
                    <span class="text-secondary small d-block">Full Name</span>
                    <strong class="text-white fs-5">{{ user_name }}</strong>
                </div>
                <div class="mb-3">
                    <span class="text-secondary small d-block">Email Address</span>
                    <strong class="text-white fs-5">{{ user_email }}</strong>
                </div>
                <div>
                    <span class="text-secondary small d-block">System Access Level</span>
                    <strong class="text-success fs-6"><i class="bi bi-shield-check me-1"></i> Administrator Privileges (Full Access)</strong>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary-custom flex-grow-1">
                    <i class="bi bi-speedometer2 me-1"></i> Dashboard
                </a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary-custom flex-grow-1 text-center">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
